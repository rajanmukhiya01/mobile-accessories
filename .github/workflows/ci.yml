name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.0'

    - name: Get composer
      run: composer --version || php -r "copy('https://getcomposer.org/installer','composer-setup.php');" && php composer-setup.php --install-dir=/tmp --filename=composer && php /tmp/composer --version

    - name: Install dependencies
      run: php /tmp/composer install --no-interaction --prefer-dist

    - name: PHP syntax check
      run: |
        find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
